<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoPreporuka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stil.css">
</head>
<body>

<div class="container mt-4">
    <header class="text-center mb-5">
        <h1 class="display-4 fw-bold text-uppercase" style="letter-spacing: 2px;">Kino preporuka</h1>
        <p id="savjetDana" class="text-info fst-italic"></p>
        
        <div class="input-group mb-3 mx-auto shadow-sm" style="max-width: 600px;">
            <input type="text" id="unosFilm" class="form-control border-0" placeholder="Pretraži filmove po naslovu...">
            <button class="btn btn-danger px-4" onclick="pretraziFilm()">Pretraži</button>
        </div>
        
        <div id="brziGumbi" class="d-flex justify-content-center flex-wrap gap-2"></div>
    </header>

    <div id="ucitavanje" class="text-center d-none my-5">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="mt-2">Učitavanje podataka...</p>
    </div>

    <h2 id="naslovSekcije" class="mb-4 fw-bold">Trenutno popularno</h2>
    <div id="mrezaFilmova" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-5"></div>
</div>

<div class="modal fade" id="filmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary shadow-lg">
            <div class="modal-header border-0">
                <h4 class="modal-title fw-bold" id="modalNaslov"></h4>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-5 mb-3 mb-md-0 text-center">
                        <img id="modalPoster" src="" class="img-fluid rounded-3 shadow" alt="Poster">
                    </div>
                    <div class="col-md-7">
                        <h6 class="text-danger text-uppercase fw-bold">Opis filma</h6>
                        <p id="modalOpis" class="lh-base"></p>
                        <hr class="border-secondary">
                        <p class="mb-1"><strong>Glumci:</strong> <span id="modalGlumci"></span></p>
                        <p class="mb-1"><strong>Trajanje:</strong> <span id="modalTrajanje"></span> min</p>
                        <p class="mb-1"><strong>Žanrovi:</strong> <span id="modalZanrovi"></span></p>
                        <p class="mb-0"><strong>Ocjena:</strong> <span id="modalOcjena" class="text-warning fw-bold"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="skripta.js"></script>
</body>
</html>
